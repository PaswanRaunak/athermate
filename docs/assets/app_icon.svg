<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24" />
    </clipPath>
  </defs>

  <!-- Base background with rounded squircle clipping -->
  <g clip-path="url(#squircle)">
    <!-- Dark Slate Base -->
    <rect width="108" height="108" fill="#0A0E17" />

    <!-- Inner Radial Disc -->
    <path d="M54,11 A43,43 0 1,0 54,97 A43,43 0 1,0 54,11 Z" fill="#101726" stroke="#1E293B" stroke-width="1.5" />

    <!-- Foreground Elements -->
    <!-- Speed Dash lines -->
    <path d="M16,57 L23,57 M12,63 L21,63 M15,69 L22,69" stroke="#00E59B" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.45" />

    <!-- Rear Wheel (Ather Green Tires & Accents) -->
    <path d="M34,56.5 A11.5,11.5 0 1,0 34,79.5 A11.5,11.5 0 1,0 34,56.5 Z" fill="#131B28" stroke="#334155" stroke-width="2.5" />
    <path d="M34,59.5 A8.5,8.5 0 1,0 34,76.5 A8.5,8.5 0 1,0 34,59.5 Z" fill="none" stroke="#00E59B" stroke-width="2.2" />
    <path d="M34,64.5 A3.5,3.5 0 1,0 34,71.5 A3.5,3.5 0 1,0 34,64.5 Z" fill="#00E59B" />

    <!-- Front Wheel (Ather Green Tires & Accents) -->
    <path d="M74,56.5 A11.5,11.5 0 1,0 74,79.5 A11.5,11.5 0 1,0 74,56.5 Z" fill="#131B28" stroke="#334155" stroke-width="2.5" />
    <path d="M74,59.5 A8.5,8.5 0 1,0 74,76.5 A8.5,8.5 0 1,0 74,59.5 Z" fill="none" stroke="#00E59B" stroke-width="2.2" />
    <path d="M74,64.5 A3.5,3.5 0 1,0 74,71.5 A3.5,3.5 0 1,0 74,64.5 Z" fill="#00E59B" />

    <!-- Front Fork -->
    <path d="M69,52 L74,68" stroke="#64748B" stroke-width="3" stroke-linecap="round" />

    <!-- Solid Seat -->
    <path d="M25,47 C29,43.5 45,43.5 50,47 Z" fill="#1E293B" />

    <!-- Main Scooter Bodywork -->
    <path d="M25,47 L50,47 L52,56 L58,56 L65,37 L78,46 L71,58 L64,62 L44,62 L36,57 L25,47 Z" fill="#FFFFFF" />

    <!-- Lower Battery Spine -->
    <path d="M43,62 L64,62 L63,66 L44,66 Z" fill="#1E293B" />

    <!-- Inner Dark Panels -->
    <path d="M28,49 L46,49 L41,55 L29,54 Z" fill="#0F172A" />
    <path d="M65,39 L74,45 L69,53 L62,46 Z" fill="#0F172A" />

    <!-- Headlight DRL -->
    <path d="M75,45 L78,47.5 L73,53" fill="none" stroke="#00E59B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stem & Handlebar -->
    <path d="M65,37 L65,32" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <path d="M59,33.5 L65,32 L71,33.5" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M58.5,32.2 A1.3,1.3 0 1,0 58.5,34.8 A1.3,1.3 0 1,0 58.5,32.2 Z" fill="#00E59B" />
    <path d="M71.5,32.2 A1.3,1.3 0 1,0 71.5,34.8 A1.3,1.3 0 1,0 71.5,32.2 Z" fill="#00E59B" />
    <path d="M63.5,30.5 h3 v2 h-3 z" fill="#00E59B" />

    <!-- Athr+ Plus Accent Badge -->
    <path d="M36,48.3 L36,54.7 M32.8,51.5 L39.2,51.5" stroke="#FF5A2A" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
